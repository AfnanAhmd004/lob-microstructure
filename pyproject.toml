[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = ""
version = "0.1.0"
description = "Limit order book, order-flow imbalance research and execution algorithms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Afnan Ahmed Adil" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "sortedcontainers>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["lob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
